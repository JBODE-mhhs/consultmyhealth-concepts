<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Consult My Health — scroll-world concept</title>
  <meta name="description" content="Scroll-scrubbed concept build. Placeholder copy throughout." />
  <style>
    :root, .sw-root {
      --sw-bg: #F4EDE4;          /* == the generated scene background */
      --sw-ink: #3F4A3E;         /* deep moss */
      --sw-ink-soft: #6E7A6B;
      --sw-accent: #8FA98C;      /* sage; per-section accents override at runtime */
    }

    /* ── PLACEHOLDER DISCIPLINE ──────────────────────────────────────────────
       The business behind this domain is UNKNOWN. Every word of copy below is
       invented scaffolding. It is marked amber + dashed ON PURPOSE so that no
       reader, at any zoom, can mistake it for a fact about a real practice.
       A health site with fabricated practitioners, credentials or claims is a
       real harm, not a rough draft. Ugly beats plausible.                     */
    /* ★Selectors VERIFIED against scrub-engine.js, not guessed: the engine emits BEM
       (`sw-copy__title`), and my first attempt used `sw-title`, which matched NOTHING.
       A CSS rule that matches nothing renders identically to no rule at all — it was
       caught by LOOKING at a screenshot, never by re-reading the stylesheet. */
    .sw-copy__eyebrow, .sw-copy__title, .sw-copy__body, .sw-copy__tags {
      text-decoration: underline wavy rgba(201,123,90,.9) 1.5px;
      text-underline-offset: 6px;
      text-decoration-skip-ink: none;
    }
    #ph-banner {
      position: fixed; inset: 0 0 auto 0; z-index: 9999;
      background: #C97B5A; color: #fff;
      font: 600 12px/1.5 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .04em; text-align: center;
      padding: 7px 12px; padding-top: max(7px, env(safe-area-inset-top));
    }
    #ph-banner b { font-weight: 800; }
  </style>
</head>
<body>
  <div id="ph-banner">
    <b>CONCEPT BUILD — PLACEHOLDER COPY.</b>
    Nothing on this page is a claim about a real business. No practitioners, credentials, services or statistics are stated.
  </div>

  <div id="top"></div>
  <div id="world"></div>

  <script src="assets/scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Consult My Health', href: '#top' },
      cta:   { label: 'Get in touch', href: '#finale' },
      hint:  'scroll to fly in',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'arrival', label: 'Arrival',
          still: 'assets/img/scene1.webp',
          clip:  'assets/vid/scene1.mp4',
          accent: '#8FA98C',
          scroll: 1.6, linger: 0.40,
          eyebrow: 'Where it starts',
          title:   'Start with a conversation.',
          body:    'A calm place to bring a question.',
          tags: [],
        },
        {
          id: 'consult', label: 'The Room',
          still: 'assets/img/scene2.webp',
          clip:  'assets/vid/scene2.mp4',
          accent: '#7E9A7B',
          scroll: 1.5, linger: 0.45,
          eyebrow: 'Sitting down',
          title:   'Room to be heard.',
          body:    'Time to talk it through, without the rush.',
          tags: [],
        },
        {
          id: 'between', label: 'Between Visits',
          still: 'assets/img/scene3.webp',
          clip:  'assets/vid/scene3.mp4',
          accent: '#C97B5A',
          scroll: 1.3, linger: 0.30,
          eyebrow: 'Behind the scenes',
          title:   'Someone keeps track.',
          body:    'The details are carried forward, so you do not have to.',
          tags: [],
        },
        {
          id: 'finale', label: 'The Door',
          still: 'assets/img/scene4.webp',
          clip:  'assets/vid/scene4.mp4',
          accent: '#8FA98C',
          scroll: 1.7, linger: 0.50,
          eyebrow: 'When you are ready',
          title:   'The door stays open.',
          body:    'Come in when it suits you.',
          tags: [],
          cta: { primary: { label: 'Get in touch', href: '#' } },
        },
      ],
      // length === sections.length - 1, in order. Each connector's endpoints are the
      // ACTUAL RENDERED FRAMES of its neighbours (extracted from the SERVED encodes,
      // not the stills and not the raw downloads) — that is what frame-locks the seams.
      connectors: [
        'assets/vid/conn1.mp4',
        'assets/vid/conn2.mp4',
        'assets/vid/conn3.mp4',
      ],
    });
  </script>
</body>
</html>
