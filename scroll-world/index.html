<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Consult My Health | medical weight loss</title>
  <meta name="description" content="Medical weight loss and GLP-1 treatment, with a clinician behind it. Concept build." />
  <style>
    :root, .sw-root {
      --sw-bg: #F4EDE4;          /* == the generated scene background */
      --sw-ink: #3F4A3E;         /* deep moss */
      --sw-ink-soft: #6E7A6B;
      --sw-accent: #8FA98C;      /* sage; per-section accents override at runtime */
    }

    /* ── COPY STATUS ─────────────────────────────────────────────────────────
       Concept build. Copy states the category only: medical weight loss and
       GLP-1 treatment. No clinician names, credentials, registrations,
       medication brand names, prices, outcome statistics, insurers or
       pharmacies appear anywhere on this page, because those facts are not yet
       confirmed for this business. The wavy underline marks wording that is
       directionally right but not yet approved. Outstanding facts: README.md */
    /* Selectors VERIFIED against scrub-engine.js, not guessed: the engine emits BEM
       (`sw-copy__title`), and my first attempt used `sw-title`, which matched NOTHING.
       A CSS rule that matches nothing renders identically to no rule at all, it was
       caught by LOOKING at a screenshot, never by re-reading the stylesheet. */
    .sw-copy__eyebrow, .sw-copy__title, .sw-copy__body, .sw-copy__tags {
      text-decoration: underline wavy rgba(201,123,90,.9) 1.5px;
      text-underline-offset: 6px;
      text-decoration-skip-ink: none;
    }
    #ph-banner {
      position: fixed; inset: 0 0 auto 0; z-index: 9999;
      background: #C97B5A; color: #fff;
      font: 600 12px/1.5 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .04em; text-align: center;
      padding: 7px 12px; padding-top: max(7px, env(safe-area-inset-top));
    }
    #ph-banner b { font-weight: 800; }
  </style>
</head>
<body>
  <div id="ph-banner">
    <b>CONCEPT BUILD.</b>
    Category copy only. No clinician names, credentials, registrations, prices, medications, outcomes or coverage are stated. Those facts are still outstanding.
  </div>

  <div id="top"></div>
  <div id="world"></div>

  <script src="assets/scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Consult My Health', href: '#top' },
      cta:   { label: 'Start your consultation', href: '#finale' },
      hint:  'scroll to begin',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'arrival', label: 'Getting Started',
          still: 'assets/img/scene1.webp',
          clip:  'assets/vid/scene1.mp4',
          accent: '#8FA98C',
          scroll: 1.6, linger: 0.40,
          eyebrow: 'Medical weight loss',
          title:   'GLP-1 treatment, with a clinician behind it.',
          body:    'Start with a medical consultation, not a checkout page.',
          tags: [],
        },
        {
          id: 'consult', label: 'Your Consultation',
          still: 'assets/img/scene2.webp',
          clip:  'assets/vid/scene2.mp4',
          accent: '#7E9A7B',
          scroll: 1.5, linger: 0.45,
          eyebrow: 'The consultation',
          title:   'A real conversation about your health.',
          body:    'Your history, your goals, and whether GLP-1 treatment is appropriate for you.',
          tags: [],
        },
        {
          id: 'between', label: 'Ongoing Care',
          still: 'assets/img/scene3.webp',
          clip:  'assets/vid/scene3.mp4',
          accent: '#C97B5A',
          scroll: 1.3, linger: 0.30,
          eyebrow: 'Ongoing care',
          title:   'Someone follows your progress.',
          body:    'Check-ins, dose adjustments and questions answered between appointments.',
          tags: [],
        },
        {
          id: 'finale', label: 'Get Started',
          still: 'assets/img/scene4.webp',
          clip:  'assets/vid/scene4.mp4',
          accent: '#8FA98C',
          scroll: 1.7, linger: 0.50,
          eyebrow: 'When you are ready',
          title:   'See if treatment is right for you.',
          body:    'A short medical intake is the first step.',
          tags: [],
          cta: { primary: { label: 'Start your consultation', href: '#' } },
        },
      ],
      // length === sections.length - 1, in order. Each connector's endpoints are the
      // ACTUAL RENDERED FRAMES of its neighbours (extracted from the SERVED encodes,
      // not the stills and not the raw downloads), that is what frame-locks the seams.
      connectors: [
        'assets/vid/conn1.mp4',
        'assets/vid/conn2.mp4',
        'assets/vid/conn3.mp4',
      ],
    });
  </script>
</body>
</html>
